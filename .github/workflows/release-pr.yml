name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: steps.release-please.outputs.pr != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-please.outputs.pr && fromJSON(steps.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.release-please.outputs.pr != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggregate changelog
        if: steps.release-please.outputs.pr != ''
        run: python scripts/aggregate_changelog.py

      - name: Commit aggregated changelog
        if: steps.release-please.outputs.pr != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update root changelog index"
          git push
