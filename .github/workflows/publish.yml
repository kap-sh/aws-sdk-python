name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build and publish
        run: cd services/${{ inputs.service }} && uv build && uv publish --trusted-publishing always
